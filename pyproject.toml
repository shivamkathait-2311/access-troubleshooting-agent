[project]
name = "access-troubleshooting-agent"
version = "0.1.0"
description = "Generic, system-agnostic access/login/permission diagnostic agent"
requires-python = ">=3.12"
dependencies = [
  # ---- core web stack ----
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  # ---- db / async ----
  "sqlalchemy[asyncio]>=2.0.35",
  "asyncpg>=0.30",
  "alembic>=1.13",
  "redis>=5.1",
  # ---- llm ----
  "openai>=2.44.0",
  # ---- auth / security / http ----
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
  "certifi>=2026.6.17",
  # ---- connectors / policy ----
  "pyyaml>=6.0",
  "ldap3>=2.9",
  # ---- secrets ----
  "hvac>=2.3",
  # ---- observability ----
  "prometheus-client>=0.21",
  # ---- background worker ----
  "arq>=0.26",
]

[project.optional-dependencies]
oracle = ["oracledb>=2.5"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.7",
  "mypy>=1.13",
  "pre-commit>=4.0",
  "types-pyyaml>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# B008: FastAPI's `Depends(...)` as an argument default is the idiomatic DI
# pattern, not the mutable-default-argument bug this rule targets.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
